<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  <script defer src="main.js"></script></head>
  <body>
    <div class="form-and-display-container">
      <div class="form-container">
        <form action="" id="locationForm">
          <div class="input-container">
            <input
              type="text"
              id="location"
              placeholder="Location (City)"
              required
            />
            <span class="clear-button">&times;</span>
          </div>
          <div class="required-error"></div>
          <button class="submit">Submit</button>
        </form>
      </div>

      <div class="info-container">
        <img src="" alt="" id="weatherIcon" height="50px" width="50px" />
        <div class="weather-info">
          <div class="date"></div>
          <div class="temp"></div>
          <div class="tempmax"></div>
          <div class="tempmin"></div>
          <div class="feelslike"></div>
          <div class="condition"></div>
          <div class="description"></div>
        </div>
      </div>
    </div>
  </body>
</html>
